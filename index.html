      {sr:"Krsna slava", cyr:"Крсна слава", de:"Hauspatron (Kirchenfest)", pron:"KRS-na SLA-va", img:"⛪"},
      {sr:"Rakija",      cyr:"Ракија",      de:"Schnaps (Obstbrand)", pron:"RA-ki-ja",   img:"🥃"},
      {sr:"Šljivovica",  cyr:"Шљивовица",   de:"Pflaumenschnaps",  pron:"SHLI-vo-vi-tsa",img:"🍶"},
      {sr:"Ćevapi",      cyr:"Ћевапи",      de:"Ćevapčići",        pron:"CHE-va-pi",     img:"🍖"},
      {sr:"Burek",       cyr:"Бурек",       de:"Burek (Gebäck)",   pron:"BU-rek",        img:"🥐"},
      {sr:"Kajmak",      cyr:"Кајмак",      de:"Kajmak (Rahm)",    pron:"KAJ-mak",       img:"🧀"},
      {sr:"Muzika",      cyr:"Музика",      de:"Musik",            pron:"MU-zi-ka",      img:"🎵"},
      {sr:"Turbo folk",  cyr:"Турбо фолк",  de:"Turbofolk (Musikstil)", pron:"TUR-bo folk", img:"🎶"},
      {sr:"Fudbal",      cyr:"Фудбал",      de:"Fußball",          pron:"FUD-bal",       img:"⚽"},
      {sr:"Košarka",     cyr:"Кошарка",     de:"Basketball",       pron:"KO-shar-ka",    img:"🏀"},
      {sr:"Plaža",       cyr:"Плажа",       de:"Strand",           pron:"PLA-zha",       img:"🏖️"},
    ],
    sentences:[
      {sr:"Srbija je lepa zemlja.",      de:"Serbien ist ein schönes Land."},
      {sr:"Beograd je glavni grad.",     de:"Belgrad ist die Hauptstadt."},
      {sr:"Volim ćevape.",               de:"Ich liebe Ćevapčići."},
      {sr:"Govorim srpski.",             de:"Ich spreche Serbisch."},
      {sr:"Ćirilica nije teška.",        de:"Die Kyrillica ist nicht schwer."},

  },
];

// ─── HELPER ───────────────────────────────────────────────────────────────────
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function randFrom(arr, n) { return shuffle(arr).slice(0, n); }

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [prog, setProg] = useState(() => load() || defState());
  const [view, setView] = useState("home"); // home | unit | flash | quiz | img | sentence | stats | alphabet
  const [unit, setUnit] = useState(null);
  const [cardI, setCardI] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [quizQ, setQuizQ] = useState(null);
  const [imgQ, setImgQ] = useState(null);
  const [sentQ, setSentQ] = useState(null);
  const [toast, setToast] = useState(null);
  const [filter, setFilter] = useState("all"); // all | A1 | A2 | B1
  const [learnDir, setLearnDir] = useState("sr2de"); // sr2de | de2sr

  useEffect(() => { save(prog); }, [prog]);

  useEffect(() => {
    const today = new Date().toDateString();
    if (prog.lastDate !== today) {
      const y = new Date(); y.setDate(y.getDate() - 1);
      const streak = prog.lastDate === y.toDateString() ? prog.streak + 1 : 1;
      setProg(p => ({ ...p, streak, lastDate: today }));
    }
  }, []);

  const showToast = (msg, ok = true) => {
    setToast({ msg, ok });
    setTimeout(() => setToast(null), 1800);
  };

  const addXP = useCallback((n, msg) => {
    setProg(p => ({ ...p, xp: p.xp + n }));
    if (msg) showToast(msg);
  }, []);

  // masteredCount for a unit
  const mastCount = (uid) => {
    const m = prog.mastered[uid];
    return m ? Object.keys(m).length : 0;
  };

  // xp level label
  const xpLabel = prog.xp < 300 ? "A1" : prog.xp < 1000 ? "A2" : "B1";
  const xpPrev = prog.xp < 300 ? 0 : prog.xp < 1000 ? 300 : 1000;
  const xpNext = prog.xp < 300 ? 300 : prog.xp < 1000 ? 1000 : 5000;
  const xpPct = Math.min(100, Math.round(((prog.xp - xpPrev) / (xpNext - xpPrev)) * 100));

  // total stats
  const totalWords = ALL_UNITS.reduce((a, u) => a + u.words.length, 0);
  const totalMastered = ALL_UNITS.reduce((a, u) => a + mastCount(u.id), 0);

  // ── FLASHCARD LOGIC ──────────────────────────────────────────────────────
  const markCard = (diff) => {
    const w = unit.words[cardI];
    if (diff !== "hard") {
      setProg(p => {
        const m = { ...(p.mastered[unit.id] || {}) };
        m[cardI] = diff;
        return { ...p, xp: p.xp + (diff === "easy" ? 8 : 4), mastered: { ...p.mastered, [unit.id]: m } };
      });
    }
    const next = cardI + 1;
    if (next >= unit.words.length) {
      showToast("Alle Karten durch! 🎉");
      setView("unit");
    } else { setCardI(next); setFlipped(false); }
  };

  // ── QUIZ LOGIC ───────────────────────────────────────────────────────────
  const makeQuiz = (u, dir) => {
    const d = dir || learnDir;
    const all = ALL_UNITS.flatMap(x => x.words);
    const words = shuffle(u.words).slice(0, Math.min(12, u.words.length));
    const q = words[0];
    const wrong = shuffle(all.filter(w => w.de !== q.de)).slice(0, 3);
    const opts = shuffle([q, ...wrong]);
    setQuizQ({ words, idx: 0, score: 0, answered: null, correct: null, opts, current: q, dir: d });
  };

  const answerQuiz = (w) => {
    if (quizQ.answered) return;
    const ok = w.de === quizQ.current.de;
    if (ok) addXP(12, "+12 XP ✓");
    setQuizQ(q => ({ ...q, answered: w, correct: ok, score: ok ? q.score + 1 : q.score }));
    setTimeout(() => {
      const ni = quizQ.idx + 1;
      if (ni >= quizQ.words.length) {
        setQuizQ(q => ({ ...q, done: true }));
      } else {
        const all = ALL_UNITS.flatMap(x => x.words);
        const nq = quizQ.words[ni];
        const wrong = shuffle(all.filter(w => w.de !== nq.de)).slice(0, 3);
        setQuizQ(q => ({ ...q, idx: ni, answered: null, correct: null, current: nq, opts: shuffle([nq, ...wrong]) }));
      }
    }, 900);
  };

  // ── IMAGE QUIZ ───────────────────────────────────────────────────────────
  const makeImgQuiz = (u, dir) => {
    const d = dir || learnDir;
    const all = ALL_UNITS.flatMap(x => x.words);
    const pool = shuffle(u.words.filter(w => w.img)).slice(0, Math.min(10, u.words.length));
    const current = pool[0];
    const wrong = shuffle(all.filter(w => w.de !== current.de)).slice(0, 3);
    const opts = shuffle([current, ...wrong]);
    setImgQ({ pool, idx: 0, score: 0, answered: null, current, opts, done: false, dir: d });
  };

  const answerImg = (w) => {
    if (imgQ.answered) return;
    const ok = w.de === imgQ.current.de;
    if (ok) addXP(15, "+15 XP 🖼️");
    setImgQ(q => ({ ...q, answered: w, correct: ok, score: ok ? q.score + 1 : q.score }));
    setTimeout(() => {
      const ni = imgQ.idx + 1;
      if (ni >= imgQ.pool.length) {
        setImgQ(q => ({ ...q, done: true }));
      } else {
        const all = ALL_UNITS.flatMap(x => x.words);
        const nc = imgQ.pool[ni];
        const wrong = shuffle(all.filter(w => w.de !== nc.de)).slice(0, 3);
        setImgQ(q => ({ ...q, idx: ni, answered: null, correct: null, current: nc, opts: shuffle([nc, ...wrong]) }));
      }
    }, 900);
  };

  // ── SENTENCE BUILDER ─────────────────────────────────────────────────────
  const makeSentQ = (u, dir) => {
    const d = dir || learnDir;
    const sents = u.sentences || [];
    if (!sents.length) { showToast("Keine Sätze für diese Unit", false); return; }
    const s = sents[Math.floor(Math.random() * sents.length)];
    // sr2de: show SR sentence, build DE answer
    // de2sr: show DE sentence, build SR answer (existing behaviour)
    const buildLang = d === "sr2de" ? "de" : "sr";
    const parts = s[buildLang].split(" ");
    const scrambled = shuffle(parts);
    setSentQ({ sents, current: s, parts, scrambled, chosen: [], done: false, correct: false, dir: d, buildLang });
  };

  const pickWord = (i) => {
    if (sentQ.done) return;
    const word = sentQ.scrambled[i];
    const newChosen = [...sentQ.chosen, { word, idx: i }];
    const newScrambled = sentQ.scrambled.map((w, j) => j === i ? null : w);
    const full = newChosen.map(c => c.word).join(" ");
    const isDone = newChosen.length === sentQ.parts.length;
    const isCorrect = isDone && full === sentQ.current[sentQ.buildLang];
    if (isDone) {
      if (isCorrect) addXP(20, "+20 XP 🏆");
      setSentQ(q => ({ ...q, chosen: newChosen, scrambled: newScrambled, done: true, correct: isCorrect }));
    } else {
      setSentQ(q => ({ ...q, chosen: newChosen, scrambled: newScrambled }));
    }
  };

  const removeWord = (i) => {
    if (sentQ.done) return;
    const removed = sentQ.chosen[i];
    const newChosen = sentQ.chosen.filter((_, j) => j !== i);
    const newScrambled = [...sentQ.scrambled];
    newScrambled[removed.idx] = removed.word;
    setSentQ(q => ({ ...q, chosen: newChosen, scrambled: newScrambled }));
  };

  const nextSent = () => {
    const { sents, dir, buildLang } = sentQ;
    const s = sents[Math.floor(Math.random() * sents.length)];
    const parts = s[buildLang].split(" ");
    setSentQ({ sents, current: s, parts, scrambled: shuffle(parts), chosen: [], done: false, correct: false, dir, buildLang });
  };

  const lv = ["A1", "A2", "B1"];
  const LEVEL_C = { A1: "#FF6B6B", A2: "#4ECDC4", B1: "#A78BFA" };
  const filteredUnits = filter === "all" ? ALL_UNITS : ALL_UNITS.filter(u => u.level === filter);

  // ─────────────────────────────── RENDER ──────────────────────────────────
  return (
    <div style={S.root}>
      {toast && <div style={{ ...S.toast, background: toast.ok ? "#22c55e" : "#ef4444" }}>{toast.msg}</div>}

      {/* ══ HOME ═══════════════════════════════════════════════════════════ */}
      {view === "home" && (
        <div style={S.page}>
          <div style={S.hdr}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div>
                <div style={S.appTitle}>🇷🇸 Serbisch</div>
                <div style={S.levelTag}>{xpLabel} · {prog.xp} XP</div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <div style={{ background: "#fff7ed", color: "#ea580c", padding: "6px 12px", borderRadius: 20, fontWeight: 700, fontSize: 13 }}>🔥 {prog.streak}</div>
                <div style={{ background: "#e0e7ff", color: "#4338ca", padding: "6px 12px", borderRadius: 20, fontWeight: 700, fontSize: 13 }}>{totalMastered}/{totalWords}</div>
              </div>
            </div>
            <div style={S.xpBg}><div style={{ ...S.xpFill, width: xpPct + "%" }} /></div>
            <div style={{ fontSize: 11, color: "#94a3b8", textAlign: "right", marginTop: 3 }}>
              {prog.xp} / {xpNext} XP → {xpLabel === "B1" ? "B1 ✓" : lv[lv.indexOf(xpLabel) + 1]}
            </div>
          </div>

          {/* Filter tabs */}
          <div style={S.filterRow}>
            {["all", "A1", "A2", "B1"].map(f => (
              <button key={f} style={{ ...S.filterBtn, background: filter === f ? "#6366f1" : "#f1f5f9", color: filter === f ? "#fff" : "#475569" }}
                onClick={() => setFilter(f)}>{f === "all" ? "Alle" : f}</button>
            ))}
          </div>

          <div style={S.scroll}>
            {lv.filter(l => filter === "all" || filter === l).map(lv => (
              <div key={lv} style={{ marginBottom: 24 }}>
                <div style={{ fontWeight: 800, fontSize: 12, color: LEVEL_C[lv], letterSpacing: 1, textTransform: "uppercase", marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: LEVEL_C[lv], display: "inline-block" }} />
                  Niveau {lv}
                </div>
                {filteredUnits.filter(u => u.level === lv).map(u => {
                  const mc = mastCount(u.id);
                  const pct = Math.round((mc / u.words.length) * 100);
                  return (
                    <div key={u.id} style={{ ...S.unitCard, borderLeft: `4px solid ${u.color}` }}
                      onClick={() => { setUnit(u); setView("unit"); }}>
                      <span style={{ fontSize: 30 }}>{u.emoji}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 15, color: "#1e293b" }}>{u.title}</div>
                        <div style={{ fontSize: 12, color: "#94a3b8" }}>{u.words.length} Wörter · {u.sentences?.length || 0} Sätze</div>
                        <div style={S.barBg}><div style={{ ...S.barFill, width: pct + "%", background: pct === 100 ? "#22c55e" : u.color }} /></div>
                      </div>
                      <div style={{ fontWeight: 800, fontSize: 15, color: pct === 100 ? "#22c55e" : u.color, minWidth: 36, textAlign: "right" }}>
                        {pct === 100 ? "✓" : pct + "%"}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
            <div style={{ height: 90 }} />
          </div>

          <div style={S.nav}>
            {[["📚", "Lernen", () => {}], ["🔤", "Alphabet", () => setView("alphabet")], ["📊", "Stats", () => setView("stats")]].map(([ic, lb, fn]) => (
              <button key={lb} style={S.navBtn} onClick={fn}>
                <div style={{ fontSize: 22 }}>{ic}</div>
                <div style={{ fontSize: 10, fontWeight: 700, color: "#64748b" }}>{lb}</div>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* ══ UNIT DETAIL ════════════════════════════════════════════════════ */}
      {view === "unit" && unit && (
        <div style={S.page}>
          <div style={{ ...S.hero, background: unit.color }}>
            <button style={S.backBtnW} onClick={() => setView("home")}>‹</button>
            <div style={{ fontSize: 56, marginBottom: 6 }}>{unit.emoji}</div>
            <div style={{ fontSize: 24, fontWeight: 900, color: "#fff" }}>{unit.title}</div>
            <div style={{ background: "rgba(255,255,255,0.25)", borderRadius: 20, padding: "4px 14px", fontSize: 13, color: "#fff", marginTop: 6 }}>
              {unit.level} · {unit.words.length} Wörter · {unit.sentences?.length || 0} Sätze
            </div>
          </div>

          <div style={S.scroll}>
            {/* Direction Toggle */}
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontWeight: 700, fontSize: 12, color: "#94a3b8", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>LERNRICHTUNG</div>
              <div style={{ display: "flex", background: "#f1f5f9", borderRadius: 14, padding: 4, gap: 4 }}>
                <button onClick={() => setLearnDir("sr2de")} style={{ flex: 1, border: "none", borderRadius: 10, padding: "10px 8px", fontWeight: 700, fontSize: 13, cursor: "pointer", background: learnDir === "sr2de" ? "#fff" : "transparent", color: learnDir === "sr2de" ? unit.color : "#64748b", boxShadow: learnDir === "sr2de" ? "0 1px 6px rgba(0,0,0,0.10)" : "none", transition: "all 0.2s" }}>
                  🇷🇸 Serbisch → 🇩🇪 Deutsch
                </button>
                <button onClick={() => setLearnDir("de2sr")} style={{ flex: 1, border: "none", borderRadius: 10, padding: "10px 8px", fontWeight: 700, fontSize: 13, cursor: "pointer", background: learnDir === "de2sr" ? "#fff" : "transparent", color: learnDir === "de2sr" ? unit.color : "#64748b", boxShadow: learnDir === "de2sr" ? "0 1px 6px rgba(0,0,0,0.10)" : "none", transition: "all 0.2s" }}>
                  🇩🇪 Deutsch → 🇷🇸 Serbisch
                </button>
              </div>
            </div>

            <div style={{ fontWeight: 700, fontSize: 13, color: "#64748b", marginBottom: 12 }}>ÜBUNGSMODI</div>
            <div style={S.modeGrid}>
              {[
                { icon: "🃏", label: "Karteikarten", fn: () => { setCardI(0); setFlipped(false); setView("flash"); } },
                { icon: "✅", label: "Quiz",         fn: () => { makeQuiz(unit, learnDir); setView("quiz"); } },
                { icon: "🖼️", label: "Bilder-Quiz",  fn: () => { makeImgQuiz(unit, learnDir); setView("img"); } },
                { icon: "🔀", label: "Satz bauen",   fn: () => { makeSentQ(unit, learnDir); setView("sentence"); } },
              ].map(m => (
                <button key={m.label} style={{ ...S.modeBtn, borderColor: unit.color }} onClick={m.fn}>
                  <span style={{ fontSize: 30 }}>{m.icon}</span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "#334155" }}>{m.label}</span>
                </button>
              ))}
            </div>

            <div style={{ fontWeight: 700, fontSize: 13, color: "#64748b", marginTop: 20, marginBottom: 10 }}>WORTLISTE</div>
            {unit.words.map((w, i) => {
              const m = prog.mastered[unit.id]?.[i];
              return (
                <div key={i} style={S.wordRow}>
                  <span style={{ ...S.dot, background: m === "easy" ? "#22c55e" : m ? unit.color : "#e2e8f0" }} />
                  <span style={{ fontSize: 20, width: 30 }}>{w.img}</span>
                  <div style={{ flex: 1 }}>
                    <span style={{ fontWeight: 700, fontSize: 14, color: "#1e293b" }}>{w.sr}</span>
                    <span style={{ color: "#94a3b8", fontSize: 12 }}> · {w.cyr}</span>
                  </div>
                  <span style={{ color: "#6366f1", fontWeight: 600, fontSize: 13 }}>{w.de}</span>
                </div>
              );
            })}

            {unit.sentences?.length > 0 && (
              <>
                <div style={{ fontWeight: 700, fontSize: 13, color: "#64748b", marginTop: 20, marginBottom: 10 }}>BEISPIELSÄTZE</div>
                {unit.sentences.map((s, i) => (
                  <div key={i} style={S.sentBox}>
                    <div style={{ fontWeight: 700, color: "#1e293b", fontSize: 14 }}>{s.sr}</div>
                    <div style={{ color: "#64748b", fontSize: 13, marginTop: 3, fontStyle: "italic" }}>{s.de}</div>
                  </div>
                ))}
              </>
            )}
            <div style={{ height: 40 }} />
          </div>
        </div>
      )}

      {/* ══ FLASHCARDS ══════════════════════════════════════════════════════ */}
      {view === "flash" && unit && (
        <div style={S.page}>
          <div style={S.topBar}>
            <button style={S.backBtn} onClick={() => setView("unit")}>‹ Zurück</button>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
              <span style={S.prog}>{cardI + 1} / {unit.words.length}</span>
              <span style={{ fontSize: 11, color: "#94a3b8", fontWeight: 600 }}>{learnDir === "sr2de" ? "🇷🇸 → 🇩🇪" : "🇩🇪 → 🇷🇸"}</span>
            </div>
          </div>
          <div style={{ display: "flex", gap: 4, justifyContent: "center", padding: "10px 16px", flexWrap: "wrap" }}>
            {unit.words.map((_, i) => (
              <div key={i} style={{ width: i === cardI ? 12 : 8, height: i === cardI ? 12 : 8, borderRadius: "50%", background: i < cardI ? "#22c55e" : i === cardI ? unit.color : "#e2e8f0", transition: "all 0.3s" }} />
            ))}
          </div>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "10px 20px" }}>
            <div onClick={() => setFlipped(f => !f)}
              style={{ width: "100%", minHeight: 260, borderRadius: 28, background: flipped ? "#1e293b" : unit.color, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 10px 40px rgba(0,0,0,0.15)", padding: 28, transition: "background 0.35s" }}>
              {!flipped ? (
                learnDir === "sr2de" ? (
                  <>
                    <div style={{ fontSize: 56, marginBottom: 8 }}>{unit.words[cardI].img}</div>
                    <div style={{ fontSize: 38, fontWeight: 900, color: "#fff", marginBottom: 6, textAlign: "center" }}>{unit.words[cardI].cyr}</div>
                    <div style={{ fontSize: 20, color: "rgba(255,255,255,0.85)", marginBottom: 4 }}>{unit.words[cardI].sr}</div>
                    <div style={{ fontSize: 13, color: "rgba(255,255,255,0.65)", fontStyle: "italic" }}>[{unit.words[cardI].pron}]</div>
                    <div style={{ fontSize: 12, color: "rgba(255,255,255,0.5)", marginTop: 20 }}>👆 Tippe zum Umdrehen</div>
                  </>
                ) : (
                  <>
                    <div style={{ fontSize: 56, marginBottom: 8 }}>{unit.words[cardI].img}</div>
                    <div style={{ fontSize: 34, fontWeight: 900, color: "#fff", marginBottom: 6, textAlign: "center" }}>{unit.words[cardI].de}</div>
                    <div style={{ fontSize: 12, color: "rgba(255,255,255,0.5)", marginTop: 20 }}>👆 Tippe zum Umdrehen</div>
                  </>
                )
              ) : (
                learnDir === "sr2de" ? (
                  <>
                    <div style={{ fontSize: 40, fontWeight: 900, color: "#fff", textAlign: "center" }}>{unit.words[cardI].de}</div>
                    <div style={{ fontSize: 18, color: "rgba(255,255,255,0.7)", marginTop: 10 }}>{unit.words[cardI].sr}</div>
                  </>
                ) : (
                  <>
                    <div style={{ fontSize: 38, fontWeight: 900, color: "#fff", marginBottom: 6, textAlign: "center" }}>{unit.words[cardI].cyr}</div>
                    <div style={{ fontSize: 20, color: "rgba(255,255,255,0.8)", marginBottom: 4 }}>{unit.words[cardI].sr}</div>
                    <div style={{ fontSize: 13, color: "rgba(255,255,255,0.6)", fontStyle: "italic" }}>[{unit.words[cardI].pron}]</div>
                  </>
                )
              )}
            </div>
          </div>
          <div style={{ display: "flex", gap: 10, padding: "16px 20px 30px" }}>
            {[["hard", "😣 Schwer", "#fee2e2", "#ef4444"], ["ok", "🤔 OK", "#fef9c3", "#ca8a04"], ["easy", "😄 Leicht", "#dcfce7", "#16a34a"]].map(([d, l, bg, c]) => (
              <button key={d} style={{ flex: 1, background: bg, color: c, border: "none", borderRadius: 16, padding: "14px 6px", fontWeight: 700, fontSize: 12, cursor: "pointer" }}
                onClick={() => markCard(d)}>{l}</button>
            ))}
          </div>
        </div>
      )}

      {/* ══ QUIZ ════════════════════════════════════════════════════════════ */}
      {view === "quiz" && unit && quizQ && (
        <div style={S.page}>
          <div style={S.topBar}>
            <button style={S.backBtn} onClick={() => { setView("unit"); setQuizQ(null); }}>‹ Zurück</button>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
              <span style={S.prog}>{quizQ.idx + 1}/{quizQ.words.length}</span>
              <span style={{ fontSize: 11, color: "#94a3b8", fontWeight: 600 }}>{quizQ.dir === "sr2de" ? "🇷🇸 → 🇩🇪" : "🇩🇪 → 🇷🇸"}</span>
            </div>
          </div>
          {quizQ.done ? (
            <div style={S.donePage}>
              <div style={{ fontSize: 80 }}>{quizQ.score >= quizQ.words.length * 0.8 ? "🏆" : "💪"}</div>
              <div style={{ fontSize: 44, fontWeight: 900, color: "#1e293b" }}>{quizQ.score}/{quizQ.words.length}</div>
              <div style={{ color: "#64748b", fontSize: 18, margin: "8px 0 28px" }}>
                {quizQ.score >= quizQ.words.length * 0.8 ? "Ausgezeichnet!" : "Weiter üben!"}
              </div>
              <button style={{ ...S.bigBtn, background: unit.color }} onClick={() => makeQuiz(unit, quizQ.dir)}>🔄 Nochmal</button>
              <button style={{ ...S.bigBtn, background: "#64748b", marginTop: 10 }} onClick={() => { setView("unit"); setQuizQ(null); }}>← Zurück</button>
            </div>
          ) : (
            <div style={{ flex: 1, padding: "16px 18px", display: "flex", flexDirection: "column", gap: 12, overflowY: "auto" }}>
              <div style={{ background: "#fff", borderRadius: 22, padding: 24, border: `2px solid ${unit.color}`, textAlign: "center" }}>
                <div style={{ fontSize: 44, marginBottom: 8 }}>{quizQ.current.img}</div>
                {quizQ.dir === "sr2de" ? (
                  <>
                    <div style={{ fontSize: 32, fontWeight: 900, color: "#1e293b" }}>{quizQ.current.cyr}</div>
                    <div style={{ fontSize: 16, color: "#475569", marginTop: 4 }}>{quizQ.current.sr}</div>
                    <div style={{ fontSize: 12, color: "#94a3b8", fontStyle: "italic" }}>[{quizQ.current.pron}]</div>
                  </>
                ) : (
                  <div style={{ fontSize: 28, fontWeight: 900, color: "#1e293b" }}>{quizQ.current.de}</div>
                )}
              </div>
              <div style={{ fontSize: 13, color: "#64748b", fontWeight: 600 }}>
                {quizQ.dir === "sr2de" ? "Was bedeutet das auf Deutsch?" : "Wie sagt man das auf Serbisch (Kyrillisch)?"}
              </div>
              {quizQ.opts.map((opt, i) => {
                const isCorrect = opt.de === quizQ.current.de;
                const isSelected = quizQ.answered?.de === opt.de;
                let bg = "#f8fafc", bc = "#e2e8f0", col = "#1e293b";
                if (quizQ.answered) {
                  if (isCorrect) { bg = "#dcfce7"; bc = "#22c55e"; col = "#166534"; }
                  else if (isSelected) { bg = "#fee2e2"; bc = "#ef4444"; col = "#991b1b"; }
                }
                return (
                  <button key={i} style={{ background: bg, border: `2px solid ${bc}`, color: col, borderRadius: 16, padding: "16px 18px", fontSize: 15, fontWeight: 600, textAlign: "left", cursor: "pointer", transition: "all 0.15s" }}
                    onClick={() => answerQuiz(opt)}>
                    {quizQ.answered && isCorrect ? "✓ " : quizQ.answered && isSelected ? "✗ " : ""}
                    {quizQ.dir === "sr2de" ? opt.de : `${opt.cyr} (${opt.sr})`}
                  </button>
                );
              })}
              <div style={{ textAlign: "center", color: "#94a3b8", fontSize: 13 }}>⭐ {quizQ.score} Punkte</div>
            </div>
          )}
        </div>
      )}

      {/* ══ BILD-QUIZ ═══════════════════════════════════════════════════════ */}
      {view === "img" && unit && imgQ && (
        <div style={S.page}>
          <div style={S.topBar}>
            <button style={S.backBtn} onClick={() => { setView("unit"); setImgQ(null); }}>‹ Zurück</button>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
              <span style={S.prog}>{imgQ.idx + 1}/{imgQ.pool.length}</span>
              <span style={{ fontSize: 11, color: "#94a3b8", fontWeight: 600 }}>{imgQ.dir === "sr2de" ? "🇷🇸 → 🇩🇪" : "🇩🇪 → 🇷🇸"}</span>
            </div>
          </div>
          {imgQ.done ? (
            <div style={S.donePage}>
              <div style={{ fontSize: 80 }}>🖼️</div>
              <div style={{ fontSize: 44, fontWeight: 900, color: "#1e293b" }}>{imgQ.score}/{imgQ.pool.length}</div>
              <div style={{ color: "#64748b", fontSize: 18, margin: "8px 0 28px" }}>Bilder-Quiz fertig!</div>
              <button style={{ ...S.bigBtn, background: unit.color }} onClick={() => makeImgQuiz(unit, imgQ.dir)}>🔄 Nochmal</button>
              <button style={{ ...S.bigBtn, background: "#64748b", marginTop: 10 }} onClick={() => { setView("unit"); setImgQ(null); }}>← Zurück</button>
            </div>
          ) : (
            <div style={{ flex: 1, padding: "16px 18px", display: "flex", flexDirection: "column", gap: 14 }}>
              {/* Big emoji card */}
              <div style={{ background: `${unit.color}22`, borderRadius: 28, padding: "40px 20px", textAlign: "center", border: `3px solid ${unit.color}` }}>
                <div style={{ fontSize: 88 }}>{imgQ.current.img}</div>
                <div style={{ fontSize: 13, color: unit.color, fontWeight: 700, marginTop: 12 }}>
                  {imgQ.dir === "sr2de" ? "Was bedeutet das auf Deutsch?" : "Wie heißt das auf Serbisch?"}
                </div>
              </div>
              {imgQ.opts.map((opt, i) => {
                const isCorrect = opt.de === imgQ.current.de;
                const isSel = imgQ.answered?.de === opt.de;
                let bg = "#f8fafc", bc = "#e2e8f0", col = "#1e293b";
                if (imgQ.answered) {
                  if (isCorrect) { bg = "#dcfce7"; bc = "#22c55e"; col = "#166534"; }
                  else if (isSel) { bg = "#fee2e2"; bc = "#ef4444"; col = "#991b1b"; }
                }
                return (
                  <button key={i} style={{ background: bg, border: `2px solid ${bc}`, color: col, borderRadius: 16, padding: "18px", fontSize: 15, fontWeight: 600, textAlign: "center", cursor: "pointer" }}
                    onClick={() => answerImg(opt)}>
                    {imgQ.answered && isCorrect ? "✓ " : imgQ.answered && isSel ? "✗ " : ""}
                    {imgQ.dir === "sr2de" ? opt.de : `${opt.cyr} (${opt.sr})`}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ══ SATZ BAUEN ══════════════════════════════════════════════════════ */}
      {view === "sentence" && unit && sentQ && (
        <div style={S.page}>
          <div style={S.topBar}>
            <button style={S.backBtn} onClick={() => setView("unit")}>‹ Zurück</button>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
              <span style={S.prog}>Satz bauen 🔀</span>
              <span style={{ fontSize: 11, color: "#94a3b8", fontWeight: 600 }}>{sentQ.dir === "sr2de" ? "🇷🇸 → 🇩🇪" : "🇩🇪 → 🇷🇸"}</span>
            </div>
          </div>
          <div style={{ flex: 1, padding: "16px 18px", display: "flex", flexDirection: "column", gap: 16 }}>
            {/* Prompt sentence */}
            <div style={{ background: "#f1f5f9", borderRadius: 18, padding: "20px", textAlign: "center", border: "2px solid #e2e8f0" }}>
              <div style={{ fontSize: 12, color: "#94a3b8", fontWeight: 700, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>
                {sentQ.dir === "sr2de" ? "Übersetze ins Deutsche:" : "Übersetze ins Serbische:"}
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: "#1e293b" }}>
                {sentQ.dir === "sr2de" ? sentQ.current.sr : sentQ.current.de}
              </div>
              {sentQ.dir === "sr2de" && (
                <div style={{ fontSize: 13, color: "#94a3b8", marginTop: 4 }}>{sentQ.current.de.replace(/./g, "·")}</div>
              )}
            </div>

            {/* Answer area */}
            <div style={{ minHeight: 60, background: "#fff", borderRadius: 18, border: `2px dashed ${sentQ.done ? (sentQ.correct ? "#22c55e" : "#ef4444") : unit.color}`, padding: "14px 14px", display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
              {sentQ.chosen.length === 0 && <span style={{ color: "#cbd5e1", fontSize: 14 }}>Tippe auf Wörter unten...</span>}
              {sentQ.chosen.map((c, i) => (
                <button key={i} style={{ background: unit.color, color: "#fff", border: "none", borderRadius: 10, padding: "8px 14px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}
                  onClick={() => removeWord(i)}>{c.word}</button>
              ))}
            </div>

            {sentQ.done && (
              <div style={{ background: sentQ.correct ? "#dcfce7" : "#fee2e2", borderRadius: 14, padding: "14px 18px", textAlign: "center" }}>
                <div style={{ fontWeight: 700, fontSize: 16, color: sentQ.correct ? "#166534" : "#991b1b" }}>
                  {sentQ.correct ? "✓ Richtig! +20 XP" : "✗ Falsch"}
                </div>
                {!sentQ.correct && (
                  <div style={{ color: "#ef4444", fontSize: 13, marginTop: 4 }}>
                    Richtig: {sentQ.current[sentQ.buildLang]}
                  </div>
                )}
                <button style={{ marginTop: 12, background: unit.color, color: "#fff", border: "none", borderRadius: 14, padding: "12px 28px", fontWeight: 700, fontSize: 14, cursor: "pointer" }}
                  onClick={nextSent}>Nächster Satz →</button>
              </div>
            )}

            {/* Word bank */}
            {!sentQ.done && (
              <div style={{ background: "#f8fafc", borderRadius: 18, padding: "16px", border: "1px solid #e2e8f0" }}>
                <div style={{ fontSize: 11, color: "#94a3b8", fontWeight: 700, marginBottom: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>Wörter</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {sentQ.scrambled.map((w, i) => w && (
                    <button key={i} style={{ background: "#fff", color: "#334155", border: "2px solid #e2e8f0", borderRadius: 10, padding: "8px 14px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
                      onClick={() => pickWord(i)}>{w}</button>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ══ ALPHABET ════════════════════════════════════════════════════════ */}
      {view === "alphabet" && (
        <div style={S.page}>
          <div style={S.topBar}>
            <button style={S.backBtn} onClick={() => setView("home")}>‹ Zurück</button>
            <span style={{ fontWeight: 700, fontSize: 16 }}>Serbisches Alphabet</span>
          </div>
          <div style={S.scroll}>
            <div style={{ fontWeight: 700, fontSize: 13, color: "#6366f1", marginBottom: 12 }}>
              Kyrillisch ↔ Lateinisch · Jeder Buchstabe = 1 Laut!
            </div>
            {[
              ["А","A","a"],["Б","B","b"],["В","V","v"],["Г","G","g"],["Д","D","d"],
              ["Ђ","Đ","dj"],["Е","E","e"],["Ж","Ž","ž"],["З","Z","z"],["И","I","i"],
              ["Ј","J","j"],["К","K","k"],["Л","L","l"],["Љ","Lj","lj"],["М","M","m"],
              ["Н","N","n"],["Њ","Nj","nj"],["О","O","o"],["П","P","p"],["Р","R","r"],
              ["С","S","s"],["Т","T","t"],["Ћ","Ć","tʃ(wch)"],["У","U","u"],["Ф","F","f"],
              ["Х","H","h"],["Ц","C","ts"],["Ч","Č","tʃ"],["Џ","Dž","dʒ"],["Ш","Š","ʃ"]
            ].map(([cyr, lat, snd]) => (
              <div key={cyr} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: "1px solid #f1f5f9" }}>
                <div style={{ width: 46, height: 46, borderRadius: 12, background: "linear-gradient(135deg,#6366f1,#a78bfa)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: 900, color: "#fff", flexShrink: 0 }}>{cyr}</div>
                <div style={{ width: 36, fontWeight: 700, fontSize: 18, color: "#334155" }}>{lat}</div>
                <div style={{ flex: 1, fontSize: 13, color: "#64748b", fontStyle: "italic" }}>Aussprache: [{snd}]</div>
              </div>
            ))}
            <div style={{ height: 40 }} />
          </div>
        </div>
      )}

      {/* ══ STATS ═══════════════════════════════════════════════════════════ */}
      {view === "stats" && (
        <div style={S.page}>
          <div style={S.topBar}>
            <button style={S.backBtn} onClick={() => setView("home")}>‹ Zurück</button>
            <span style={{ fontWeight: 700, fontSize: 16 }}>Dein Fortschritt</span>
          </div>
          <div style={S.scroll}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 20 }}>
              {[
                ["🔥", prog.streak, "Tage-Serie", "#fef3c7"],
                ["⭐", prog.xp, "XP gesamt", "#e0e7ff"],
                ["✅", totalMastered, "Wörter gemeistert", "#dcfce7"],
                ["📚", ALL_UNITS.filter(u => mastCount(u.id) === u.words.length).length + "/" + ALL_UNITS.length, "Units fertig", "#fce7f3"],
              ].map(([ic, v, l, bg]) => (
                <div key={l} style={{ background: bg, borderRadius: 18, padding: 16, textAlign: "center" }}>
                  <div style={{ fontSize: 30, marginBottom: 4 }}>{ic}</div>
                  <div style={{ fontSize: 26, fontWeight: 900, color: "#1e293b" }}>{v}</div>
                  <div style={{ fontSize: 12, color: "#64748b", marginTop: 2 }}>{l}</div>
                </div>
              ))}
            </div>
            <div style={{ fontWeight: 700, fontSize: 13, color: "#94a3b8", marginBottom: 12, textTransform: "uppercase", letterSpacing: 1 }}>Fortschritt pro Unit</div>
            {ALL_UNITS.map(u => {
              const mc = mastCount(u.id);
              const pct = Math.round((mc / u.words.length) * 100);
              return (
                <div key={u.id} style={{ marginBottom: 14 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
                    <span>{u.emoji} {u.title} <span style={{ color: "#94a3b8", fontSize: 11 }}>({u.level})</span></span>
                    <span style={{ fontWeight: 700, color: pct === 100 ? "#22c55e" : u.color }}>{mc}/{u.words.length}</span>
                  </div>
                  <div style={{ ...S.barBg, height: 8 }}><div style={{ ...S.barFill, width: pct + "%", background: pct === 100 ? "#22c55e" : u.color }} /></div>
                </div>
              );
            })}
            <div style={{ marginTop: 24, textAlign: "center" }}>
              <button style={{ background: "#fee2e2", color: "#ef4444", border: "none", borderRadius: 14, padding: "12px 28px", fontWeight: 700, cursor: "pointer" }}
                onClick={() => { if (window.confirm("Wirklich alle Daten löschen?")) { setProg(defState()); showToast("Zurückgesetzt", false); } }}>
                🗑️ Fortschritt löschen
              </button>
            </div>
            <div style={{ height: 40 }} />
          </div>
        </div>
      )}
    </div>
  );
}

// ─── STYLES ───────────────────────────────────────────────────────────────────
const S = {
  root: { fontFamily: "'Nunito','Segoe UI',sans-serif", background: "#f8fafc", minHeight: "100vh", maxWidth: 440, margin: "0 auto" },
  page: { display: "flex", flexDirection: "column", minHeight: "100vh" },
  toast: { position: "fixed", top: 20, left: "50%", transform: "translateX(-50%)", color: "#fff", fontWeight: 800, fontSize: 15, padding: "10px 24px", borderRadius: 30, zIndex: 9999, boxShadow: "0 4px 20px rgba(0,0,0,0.25)", whiteSpace: "nowrap" },
  hdr: { background: "#fff", padding: "20px 18px 14px", borderBottom: "1px solid #e2e8f0" },
  appTitle: { fontSize: 28, fontWeight: 900, color: "#1e293b" },
  levelTag: { fontSize: 13, color: "#6366f1", fontWeight: 700, marginTop: 2 },
  pill: (_, bg, col) => ({ background: bg, color: col, padding: "6px 12px", borderRadius: 20, fontWeight: 700, fontSize: 13 }),
  xpBg: { background: "#e2e8f0", borderRadius: 10, height: 10, overflow: "hidden" },
  xpFill: { height: "100%", background: "linear-gradient(90deg,#6366f1,#a78bfa)", borderRadius: 10, transition: "width 0.6s ease" },
  filterRow: { display: "flex", gap: 8, padding: "12px 18px", background: "#fff", borderBottom: "1px solid #f1f5f9" },
  filterBtn: { border: "none", borderRadius: 20, padding: "7px 16px", fontWeight: 700, fontSize: 13, cursor: "pointer", transition: "all 0.2s" },
  scroll: { flex: 1, overflowY: "auto", padding: "16px 18px 0" },
  unitCard: { background: "#fff", borderRadius: 16, padding: "14px 14px", marginBottom: 10, display: "flex", alignItems: "center", gap: 12, boxShadow: "0 1px 6px rgba(0,0,0,0.06)", cursor: "pointer" },
  barBg: { background: "#e2e8f0", borderRadius: 6, height: 5, marginTop: 6, overflow: "hidden" },
  barFill: { height: "100%", borderRadius: 6, transition: "width 0.5s" },
  nav: { position: "sticky", bottom: 0, background: "#fff", borderTop: "1px solid #e2e8f0", display: "flex", justifyContent: "space-around", padding: "10px 0 18px" },
  navBtn: { background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2 },
  hero: { padding: "50px 20px 28px", display: "flex", flexDirection: "column", alignItems: "center", color: "#fff", position: "relative" },
  backBtnW: { position: "absolute", top: 14, left: 14, background: "rgba(255,255,255,0.25)", border: "none", color: "#fff", fontSize: 26, fontWeight: 700, width: 42, height: 42, borderRadius: 12, cursor: "pointer" },
  modeGrid: { display: "flex", gap: 10, marginBottom: 4 },
  modeBtn: { flex: 1, background: "#fff", border: "2px solid", borderRadius: 16, padding: "14px 6px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 6 },
  wordRow: { display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid #f8fafc" },
  dot: { width: 10, height: 10, borderRadius: "50%", flexShrink: 0 },
  sentBox: { background: "#f8fafc", borderRadius: 14, padding: "14px 16px", marginBottom: 8, borderLeft: "3px solid #6366f1" },
  topBar: { background: "#fff", padding: "16px 18px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid #e2e8f0" },
  backBtn: { background: "none", border: "none", fontSize: 17, color: "#6366f1", fontWeight: 700, cursor: "pointer" },
  prog: { fontWeight: 700, fontSize: 15, color: "#475569" },
  donePage: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, gap: 4 },
  bigBtn: { width: "100%", border: "none", borderRadius: 16, padding: 16, color: "#fff", fontWeight: 800, fontSize: 16, cursor: "pointer" },
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
